<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>İletişim | TVK Group Türkiye</title>
  <meta name="description" content="Stratejik ortaklıklar, iş geliştirme ve kurumsal iş birliği için TVK Group Türkiye ile iletişime geçin." />
  <meta name="theme-color" content="#07111f" />
  <meta property="og:title" content="TVK Group Türkiye" />
  <meta property="og:description" content="Geleceğin teknoloji, altyapı ve stratejik yatırımları." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body data-page="contact" data-page-title="contactPageTitle" data-meta-description="contactMeta">
  <div id="site-header"></div>
  <main id="main">
    <section class="page-hero">
      <div class="wrap">
        <span class="eyebrow" data-i18n="navContact">İletişim</span>
        <h1 data-i18n="contactHeroTitle">İletişim</h1>
        <p data-i18n="contactHeroLead"></p>
      </div>
    </section>

    <section class="section">
      <div class="wrap contact-layout">
        <div class="contact-panel reveal">
          <h2 data-i18n="contactPanelTitle">TVK Group Türkiye ile İletişim</h2>
          <p data-i18n="contactPanelText"></p>
          <div class="contact-details">
            <div>
              <b data-i18n="contactEmailLabel">E-posta</b>
              <span>contact@t-v-k.com</span>
            </div>
            <div>
              <b data-i18n="contactCompanyLabel">Şirket</b>
              <span data-i18n="contactCompanyValue"></span>
            </div>
            <div>
              <b data-i18n="contactEcosystemLabel">TVK Ekosistemi</b>
              <span data-i18n="contactEcosystemValue"></span>
            </div>
          </div>
        </div>

        <form class="contact-form reveal" id="contact-form">
          <div class="form-grid">
            <div class="form-field">
              <label for="name" data-i18n="formName">Ad Soyad</label>
              <input id="name" name="name" type="text" required autocomplete="name" />
            </div>
            <div class="form-field">
              <label for="company" data-i18n="formCompany">Şirket</label>
              <input id="company" name="company" type="text" autocomplete="organization" />
            </div>
            <div class="form-field">
              <label for="role" data-i18n="formRole">Unvan</label>
              <input id="role" name="role" type="text" autocomplete="organization-title" />
            </div>
            <div class="form-field">
              <label for="email" data-i18n="formEmail">E-posta</label>
              <input id="email" name="email" type="email" required autocomplete="email" />
            </div>
            <div class="form-field">
              <label for="phone" data-i18n="formPhone">Telefon</label>
              <input id="phone" name="phone" type="tel" autocomplete="tel" />
            </div>
            <div class="form-field">
              <label for="country" data-i18n="formCountry">Ülke</label>
              <input id="country" name="country" type="text" autocomplete="country-name" />
            </div>
            <div class="form-field full">
              <label for="interest" data-i18n="formInterest">İlgi Alanı</label>
              <select id="interest" name="interest" required>
                <option value="" data-i18n="formInterest">İlgi Alanı</option>
                <option value="Technology Investments" data-i18n="formInterestTech">Teknoloji Yatırımları</option>
                <option value="Artificial Intelligence" data-i18n="formInterestAi">Yapay Zeka</option>
                <option value="Cybersecurity" data-i18n="formInterestCyber">Siber Güvenlik</option>
                <option value="Digital Infrastructure" data-i18n="formInterestInfra">Dijital Altyapı</option>
                <option value="Energy & Infrastructure" data-i18n="formInterestEnergy">Enerji ve Altyapı</option>
                <option value="International Trade" data-i18n="formInterestTrade">Uluslararası Ticaret</option>
                <option value="Strategic Partnerships" data-i18n="formInterestPartner">Stratejik Ortaklıklar</option>
                <option value="Other" data-i18n="formInterestOther">Diğer</option>
              </select>
            </div>
            <div class="form-field full">
              <label for="message" data-i18n="formMessage">Mesaj</label>
              <textarea id="message" name="message" required></textarea>
            </div>
          </div>
          <div class="actions" style="margin-top: 20px;">
            <button class="btn primary" type="submit" data-i18n="formSubmit">TVK Group Türkiye ile İletişim</button>
          </div>
          <p id="form-notice" class="sr-only" hidden aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="/js/translations.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
